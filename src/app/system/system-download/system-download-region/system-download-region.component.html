<howell-card>
  <div class="system-download-region">
    <div class="card-head"><div class="card-head-title">资源列表</div></div>
    <div class="card-line"></div>
    <div class="system-download-region-content card-body">
      <hw-tree-region
        [selected]="selected"
        (selectedChange)="on.selected($event)"
        (loaded)="on.loaded($event)"
        (download)="on.download($event)"
      ></hw-tree-region>
    </div>
  </div>
</howell-card>
