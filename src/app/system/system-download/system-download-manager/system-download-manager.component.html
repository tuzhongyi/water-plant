<div class="system-download-manager">
  <div class="system-download-head">
    <hw-system-download-header></hw-system-download-header>
  </div>
  <div class="system-download-body">
    <div class="system-download-tree">
      <hw-system-video-device-manager
        [regionconfigable]="false"
        [minimizeable]="false"
        [(selected)]="selected"
      ></hw-system-video-device-manager>
    </div>
    <div class="system-download-content">
      <hw-system-download-container [data]="selected"></hw-system-download-container>
    </div>
  </div>
</div>
