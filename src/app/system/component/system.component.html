<div class="system router-outlet">
  <div class="system-container">
    @if (layout.headerVisible()) {
      <div class="system-head" [class.hide]="!head.visibility">
        <howell-header
          [title]="title()"
          [(visibility)]="head.visibility"
          [collapsible]="true"
        ></howell-header>
      </div>
    }
    <div class="system-body" [class.full]="!layout.headerVisible() || !head.visibility">
      <router-outlet />
    </div>
  </div>
</div>
