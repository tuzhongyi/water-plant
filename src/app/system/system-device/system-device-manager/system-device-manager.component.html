<div class="system-device-manager">
  <div class="system-device-head">
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">类型：</div>
        <div class="form-item-value">
          <hw-select [nullable]="true" [(selected)]="table.args.type">
            <select [(ngModel)]="table.args.type">
              @for (item of source.types; track $index) {
                <option [ngValue]="item.Value">{{ item.Name }}</option>
              }
            </select>
          </hw-select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">状态：</div>
        <div class="form-item-value">
          <hw-select [nullable]="true" [(selected)]="table.args.state">
            <select [(ngModel)]="table.args.state">
              @for (item of source.states; track $index) {
                <option [ngValue]="item.Value">{{ item.Name }}</option>
              }
            </select>
          </hw-select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">主机地址：</div>
        <div class="form-item-value text">
          <input type="text" [(ngModel)]="table.args.host" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">名称：</div>
        <div class="form-item-value text">
          <input type="text" [(ngModel)]="table.args.name" />
        </div>
      </div>

      <div class="form-item submit">
        <button class="button-border full" (click)="table.on.search()">
          <i class="howell-icon-search2"></i>查询
        </button>
      </div>
    </div>
  </div>
  <div class="system-device-body">
    <div class="system-device-table">
      <hw-system-device-table
        [args]="table.args"
        [load]="table.load"
        [datas]="datas"
        (select)="table.on.select($event)"
      ></hw-system-device-table>
    </div>
    <div class="system-device-channel">
      <hw-system-device-channel-table
        [load]="channel.load"
        [clear]="channel.clear"
        (preview)="channel.on.preview($event)"
      ></hw-system-device-channel-table>
    </div>
  </div>
</div>
