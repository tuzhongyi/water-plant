<div class="system-device-channel-table">
  <div class="system-device-channel-table-body table-split">
    <div class="table-split-head">
      <table border="0" cellpadding="0" cellspacing="0" TableSorter (sort)="on.sort($event)">
        @for (width of widths; track $index) {
          <colgroup>
            <col [ngStyle]="{ width: width, 'min-width': minwidth[$index] }" />
          </colgroup>
        }
        <thead>
          <tr>
            <th sort="no">通道号</th>
            <th sort="name">名称</th>
            <th sort="state">状态</th>
            <th class="center">操作</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="table-split-body">
      <table border="0" cellpadding="0" cellspacing="0">
        <colgroup>
          <col [ngStyle]="{ width: width }" *ngFor="let width of widths" />
        </colgroup>
        <tbody>
          @for (item of datas(); track $index) {
            <tr
              (click)="onselect(item)"
              [ngClass]="{
                nohover: !item,
                nodata: !item,
                selected: item === selected,
              }"
            >
              <td [title]="item?.no || ''">
                @if (item) {
                  {{ item?.no || '-' }}
                }
              </td>

              <td [title]="item?.name || ''">
                @if (item) {
                  {{ item?.name || '-' }}
                }
              </td>
              <td
                [title]="(item?.state?.name | async) || ''"
                [class.green]="item?.state?.value == 0"
                [class.redlight]="item?.state?.value == 1"
              >
                @if (item) {
                  {{ (item.state.name | async) || '-' }}
                }
              </td>

              <td class="center">
                @if (item) {
                  <div class="operation">
                    <button
                      title="视频预览"
                      [disabled]="!item.canplay"
                      (click)="on.preview($event, item)"
                    >
                      <i class="howell-icon-video-play"></i>
                    </button>
                  </div>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
