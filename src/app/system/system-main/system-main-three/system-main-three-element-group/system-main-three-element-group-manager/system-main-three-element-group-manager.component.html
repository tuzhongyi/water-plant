<div class="system-main-three-element-group" [class.none]="!show">
  <div class="system-main-three-element-group-toggle" (click)="on.toggle()">
    <i [class]="icon"></i>
  </div>

  <div class="system-main-three-element-group-card">
    <hw-card-statistic>
      <div class="system-main-three-element-group-inner">
        <div class="system-main-three-element-group-head">
          <div class="system-main-three-element-group-head-title">
            <div class="system-main-three-element-group-head-title-content">{{ title }}</div>
          </div>
          <div class="system-main-three-element-group-head-action">
            @if (permission.signals.isRoot()) {
              <button title="同步点位名称" (click)="on.sync.open()">
                <i class="mdi mdi-sync"></i>
              </button>
            }
          </div>
        </div>
        <div class="card-line system-main-three-element-group-line"></div>
        <div class="system-main-three-element-group-search">
          <input-icon
            [(value)]="search.value"
            (clear)="on.search()"
            (keyup.enter)="on.search()"
          >
            <button (click)="on.search()"><i class="howell-icon-search"></i></button>
          </input-icon>
        </div>
        <div class="system-main-three-element-group-body">
          <hw-system-main-three-element-group-tree
            [datas]="datas"
            [hiddenIds]="hiddenIds"
            [query]="search.name"
            (position)="position.emit($event)"
            (preview)="preview.emit($event)"
            (visible)="visible.emit($event)"
            (visibleAll)="visibleAll.emit($event)"
          ></hw-system-main-three-element-group-tree>
        </div>
      </div>
    </hw-card-statistic>
  </div>

  @if (window.sync.show()) {
    <confirm-window
      [model]="window.sync"
      [content]="window.content"
      [style]="window.style"
      (ok)="on.sync.ok()"
      (cancel)="on.sync.cancel()"
    ></confirm-window>
  }
</div>
