<div class="system-main-three-manager" #container>
  <div
    class="system-main-three-container"
    wheel-ctrl
    [value]="config?.find?.radius ?? 0"
    (valueChange)="on.change($event)"
  >
    <hw-system-main-three-container
      [(args)]="map.args"
      [elementload]="map.load"
      [panelExpanded]="elementgroup.show"
      [locate]="elementgroup.position"
      [hiddenIds]="elementgroup.allhidden()"
      [alarm]="alarm"
      [unalarm]="unalarm"
      [renderPaused]="renderPaused"
      (preview)="map.on.preview($event)"
      (video)="map.on.video($event)"
      (maploaded)="map.on.maploaded($event)"
      (resetstate)="map.on.resetstate($event)"
      (expandscreen)="map.on.expandscreen($event)"
      (fullscreen)="map.on.fullscreen($event)"
    ></hw-system-main-three-container>
  </div>

  <hw-system-main-three-state
    side="left"
    [title]="map.data?.Name || ''"
    [datas]="state.datas"
    (details)="on.element($event)"
  ></hw-system-main-three-state>

  <hw-system-main-three-element-group-manager
    side="right"
    [datas]="elementgroup.datas"
    [hiddenIds]="elementgroup.allhidden()"
    [hideUnmatched]="hideUnmatched"
    [(show)]="elementgroup.show"
    (position)="elementgroup.on.position($event)"
    (preview)="map.on.preview($event)"
    (visible)="elementgroup.on.visible($event)"
    (visibleAll)="elementgroup.on.visibleAll($event)"
    (unmatched)="elementgroup.on.unmatched($event)"
  ></hw-system-main-three-element-group-manager>
</div>
