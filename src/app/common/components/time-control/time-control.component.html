<div class="time-control" [class.disabled]="disabled">
  <input
    class="time-control time hour"
    matInput
    #hourInput
    type="number"
    wheel-input-number
    [digits]="2"
    [min]="limits.hour.min"
    [max]="limits.hour.max"
    step="1"
    maxlength="2"
    minlength="1"
    [value]="model.hour.value"
    (valueChange)="on.change('hour', $event, hourInput)"
    [disabled]="disabled ?? false"
  />
  <div><i class="howell-icon-colon"></i></div>
  <input
    class="time-control time minute"
    matInput
    #minuteInput
    type="number"
    wheel-input-number
    [digits]="2"
    [min]="limits.minute.min"
    [max]="limits.minute.max"
    step="1"
    maxlength="2"
    minlength="2"
    [value]="model.minute.value"
    (valueChange)="on.change('minute', $event, minuteInput)"
    [disabled]="disabled ?? false"
  />
  <div><i class="howell-icon-colon"></i></div>
  <input
    class="time-control time second"
    matInput
    #secondInput
    type="number"
    wheel-input-number
    [digits]="2"
    [min]="limits.second.min"
    [max]="limits.second.max"
    step="1"
    maxlength="2"
    minlength="2"
    [value]="model.second.value"
    (valueChange)="on.change('second', $event, secondInput)"
    [disabled]="disabled ?? false"
  />
</div>
