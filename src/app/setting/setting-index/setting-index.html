<howell-card>
  <div class="setting-index">
    <div class="setting-index-title">
      <div
        class="button"
        [class.selected]="path == SettingPath.map"
        (click)="on.path(SettingPath.map)"
      >
        地图布控
      </div>
      <div
        class="button"
        [class.selected]="path == SettingPath.region"
        (click)="on.path(SettingPath.region)"
      >
        区域资源设置
      </div>
      <div
        class="button"
        [class.selected]="path == SettingPath.config"
        (click)="on.path(SettingPath.config)"
      >
        系统设置
      </div>
    </div>
    <div class="setting-index-content">
      <ng-content></ng-content>
    </div>
  </div>
</howell-card>
