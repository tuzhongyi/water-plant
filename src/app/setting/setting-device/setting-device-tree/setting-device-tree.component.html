<div class="setting-device-tree">
  <div class="setting-device-tree-head">
    <input-icon [(value)]="tree.args.name" (clear)="tree.to.search()">
      <button (click)="tree.to.search()"><i class="howell-icon-search"></i></button>
    </input-icon>
  </div>
  <div class="setting-device-tree-body" #body>
    <hw-tree-device
      #treeDevice
      [load]="tree.load"
      (loaded)="tree.on.loaded($event)"
      [selected]="selected()"
      (selectedChange)="tree.on.select($event)"
      [bound]="elements()"
      (bind)="tree.on.bind($event)"
      (unbind)="tree.on.unbind($event)"
      (position)="tree.on.position($event)"
      [find]="tree.find"
    ></hw-tree-device>
  </div>
</div>
