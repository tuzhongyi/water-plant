<div class="setting-device-tree">
  <div class="setting-device-tree-head">
    <input-icon [(value)]="tree.args.name" (clear)="tree.search()">
      <button (click)="tree.search()"><i class="howell-icon-search"></i></button>
    </input-icon>
  </div>
  <div class="setting-device-tree-body">
    <hw-tree-device
      [load]="tree.load"
      (loaded)="tree.loaded($event)"
      [selected]="selected()"
      (selectedChange)="tree.select($event)"
      [bound]="elements()"
      (bind)="tree.bind($event)"
      (unbind)="tree.unbind($event)"
      (position)="tree.position($event)"
    ></hw-tree-device>
  </div>
</div>
