<hw-card-statistic>
  <div class="setting-config-download">
    <div class="card-head">
      <div class="card-head-title">皮肤设置</div>
    </div>
    <div class="card-line"></div>
    <div class="card-body no-foot">
      <div class="forms">
        <div class="form-item">
          <div class="form-item-text">下载最大数量：</div>
          <div class="form-item-value fill full">
            <input
              type="text"
              wheel-input-number
              [min]="1"
              [max]="5"
              [(value)]="value"
              (valueChange)="on.change()"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</hw-card-statistic>
